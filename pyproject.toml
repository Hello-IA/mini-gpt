[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minigpt"
version = "0.1.0"
description = "Mini-GPT from scratch : tokenizer BPE, attention, ..."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["regex"]

[project.optional-dependencies]
dev = ["pytest", "tiktoken", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
